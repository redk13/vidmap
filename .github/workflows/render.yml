name: render
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - part: 0
            frames: 0-74
          - part: 1
            frames: 75-149
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --no-audit --no-fund
      - run: npx remotion render src/index.ts smoke out/part${{ matrix.part }}.mp4 --frames=${{ matrix.frames }}
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.part }}
          path: out/
  assemble:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/download-artifact@v4
        with: { path: parts }
      - run: |
          find parts -name '*.mp4' | sort | sed "s/^/file '/;s/$/'/" > list.txt
          cat list.txt
          ffmpeg -f concat -safe 0 -i list.txt -c copy smoke.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1 smoke.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-final
          path: smoke.mp4
