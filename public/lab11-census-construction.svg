<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900"><rect width="1280" height="900" fill="#ffffff"/><rect x="0" y="0" width="1280" height="7" rx="0" fill="#263e68" stroke="none" stroke-width="1"/><text x="42" y="50" font-family="sans-serif" font-size="27" font-weight="700" fill="#263e68" text-anchor="start" xml:space="preserve">United States Census Bureau</text><text x="42" y="91" font-family="sans-serif" font-size="16" font-weight="400" fill="#425565" text-anchor="start" xml:space="preserve">CENSUS.GOV  /  BUSINESS &amp; ECONOMY  /  ECONOMIC INDICATORS</text><line x1="40" y1="111" x2="1240" y2="111" stroke="#c8d0d6" stroke-width="1"/><text x="300" y="138" font-family="sans-serif" font-size="15" font-weight="400" fill="#65737d" text-anchor="start" xml:space="preserve">Census.gov  &gt;  Economic Indicators  &gt;  Press Release</text><text x="42" y="184" font-family="sans-serif" font-size="21" font-weight="700" fill="#263e68" text-anchor="start" xml:space="preserve">New Residential</text><text x="42" y="210" font-family="sans-serif" font-size="21" font-weight="700" fill="#263e68" text-anchor="start" xml:space="preserve">Construction</text><text x="42" y="252" font-family="sans-serif" font-size="17" font-weight="700" fill="#355577" text-anchor="start" xml:space="preserve">Main</text><text x="42" y="290" font-family="sans-serif" font-size="17" font-weight="400" fill="#455b70" text-anchor="start" xml:space="preserve">About the survey</text><text x="42" y="328" font-family="sans-serif" font-size="17" font-weight="400" fill="#455b70" text-anchor="start" xml:space="preserve">Data</text><text x="42" y="366" font-family="sans-serif" font-size="16" font-weight="400" fill="#455b70" text-anchor="start" xml:space="preserve">Technical documentation</text><text x="42" y="404" font-family="sans-serif" font-size="17" font-weight="400" fill="#455b70" text-anchor="start" xml:space="preserve">Release schedule</text><line x1="265" y1="160" x2="265" y2="760" stroke="#d3d9df" stroke-width="1"/><text x="300" y="170" font-family="sans-serif" font-size="15" font-weight="700" fill="#566573" text-anchor="start" xml:space="preserve">FOR IMMEDIATE RELEASE: Tuesday, October 20, 2026</text><text x="300" y="210" font-family="sans-serif" font-size="27" font-weight="700" fill="#17232d" text-anchor="start" xml:space="preserve">MONTHLY NEW RESIDENTIAL CONSTRUCTION,</text><text x="300" y="244" font-family="sans-serif" font-size="27" font-weight="700" fill="#17232d" text-anchor="start" xml:space="preserve">SEPTEMBER 2026</text><text x="300" y="280" font-family="sans-serif" font-size="16" font-weight="400" fill="#65737d" text-anchor="start" xml:space="preserve">October 20, 2026  •  CB26-162</text><text x="300" y="320" font-family="sans-serif" font-size="22" font-weight="700" fill="#17232d" text-anchor="start" xml:space="preserve">Building Permits</text><text x="300" y="360" font-family="sans-serif" font-size="20" font-weight="400" fill="#17232d" text-anchor="start" xml:space="preserve">Privately-owned housing units authorized by building permits in September were at a</text><text x="300" y="394" font-family="sans-serif" font-size="20" font-weight="400" fill="#17232d" text-anchor="start" xml:space="preserve">seasonally adjusted annual rate of 1,400,000. This is 0.2 percent below the revised</text><text x="300" y="428" font-family="sans-serif" font-size="20" font-weight="400" fill="#17232d" text-anchor="start" xml:space="preserve">August rate of 1,403,000 and is 3.0 percent below the September 2025 rate of 1,444,000.</text><text x="300" y="462" font-family="sans-serif" font-size="20" font-weight="400" fill="#17232d" text-anchor="start" xml:space="preserve">Single-family authorizations in September were at a rate of 845,000; this is 4.0 percent</text><text x="300" y="496" font-family="sans-serif" font-size="20" font-weight="400" fill="#17232d" text-anchor="start" xml:space="preserve">below the revised August figure of 880,000.</text><text x="300" y="566" font-family="sans-serif" font-size="22" font-weight="700" fill="#17232d" text-anchor="start" xml:space="preserve">Housing Starts</text><text x="300" y="606" font-family="sans-serif" font-size="20" font-weight="400" fill="#17232d" text-anchor="start" xml:space="preserve">Privately-owned housing starts in September were at a seasonally adjusted annual rate</text><text x="300" y="640" font-family="sans-serif" font-size="20" font-weight="400" fill="#17232d" text-anchor="start" xml:space="preserve">of 1,221,000. This is 5.2 percent (±11.8 percent) below the revised August estimate.</text><text x="300" y="700" font-family="sans-serif" font-size="22" font-weight="700" fill="#17232d" text-anchor="start" xml:space="preserve">Housing Completions</text><text x="300" y="740" font-family="sans-serif" font-size="20" font-weight="400" fill="#17232d" text-anchor="start" xml:space="preserve">Privately-owned housing completions in September were at a seasonally adjusted annual rate</text><text x="300" y="774" font-family="sans-serif" font-size="20" font-weight="400" fill="#17232d" text-anchor="start" xml:space="preserve">of 1,192,000.</text><line x1="300" y1="812" x2="1215" y2="812" stroke="#c8d0d6" stroke-width="1"/><text x="300" y="846" font-family="sans-serif" font-size="16" font-weight="400" fill="#52687b" text-anchor="start" xml:space="preserve">Additional Release Materials  •  Current Press Release  •  Tables</text></svg>