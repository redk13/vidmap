name: clip
on:
  workflow_dispatch:
    inputs:
      comp: {required: true}
      frames: {required: true}
jobs:
  clip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install --no-audit --no-fund
      - run: npx remotion render src/index.ts ${{ inputs.comp }} out/clip.mp4 --frames=${{ inputs.frames }} --concurrency=2 --muted
      - uses: actions/upload-artifact@v4
        with: {name: clip, path: out/clip.mp4}
