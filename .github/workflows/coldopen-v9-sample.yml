name: Tokyo V9 opening sample

on:
  push:
    branches: [tokyo-v9]

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          python -m pip install --disable-pip-version-check numpy
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Render the short opening sample on GitHub Actions
        run: |
          mkdir -p out
          npx remotion render src/index.ts coldOpenV2 out/video_raw.mp4 --frames=0-701 --concurrency=2 --muted
          python scripts/mix_coldopen.py --voice vo/01-coldopen.mp3 --output out/sample-audio.wav --duration 23.4
          ffmpeg -y -v error -i out/video_raw.mp4 -i out/sample-audio.wav \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -movflags +faststart \
            out/coldopen-v9-sample.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,nb_frames -of default=noprint_wrappers=1 out/coldopen-v9-sample.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: coldopen-v9-sample
          path: out/coldopen-v9-sample.mp4
          if-no-files-found: error
          retention-days: 7
