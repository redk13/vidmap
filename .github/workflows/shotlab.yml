name: shot-lab
on:
  push:
    branches: [shot-lab]
  workflow_dispatch:
    inputs:
      comp: {required: false, default: labLaptopVideos}
      frames: {required: false, default: 0-359}
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install --no-audit --no-fund
      - run: npx remotion render src/index.ts ${{ inputs.comp || 'labLaptopVideos' }} out/shot.mp4 --frames=${{ inputs.frames || '0-359' }} --concurrency=2 --muted
      - uses: actions/upload-artifact@v4
        with: {name: shot, path: out/shot.mp4}
