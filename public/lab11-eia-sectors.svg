<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900"><rect width="1280" height="900" fill="#ffffff"/><rect x="0" y="0" width="1280" height="7" rx="0" fill="#18536e" stroke="none" stroke-width="1"/><text x="42" y="50" font-family="sans-serif" font-size="27" font-weight="700" fill="#18536e" text-anchor="start" xml:space="preserve">U.S. Energy Information Administration</text><text x="42" y="91" font-family="sans-serif" font-size="16" font-weight="400" fill="#425565" text-anchor="start" xml:space="preserve">EIA.GOV  /  ENERGY EXPLAINED  /  U.S. ENERGY FACTS</text><line x1="40" y1="111" x2="1240" y2="111" stroke="#c8d0d6" stroke-width="1"/><text x="300" y="138" font-family="sans-serif" font-size="15" font-weight="400" fill="#65737d" text-anchor="start" xml:space="preserve">Energy Explained  &gt;  U.S. energy facts  &gt;  Consumption and production</text><text x="42" y="190" font-family="sans-serif" font-size="22" font-weight="700" fill="#18536e" text-anchor="start" xml:space="preserve">Energy Explained</text><text x="42" y="232" font-family="sans-serif" font-size="17" font-weight="400" fill="#455b70" text-anchor="start" xml:space="preserve">What is energy?</text><text x="42" y="270" font-family="sans-serif" font-size="17" font-weight="400" fill="#455b70" text-anchor="start" xml:space="preserve">Units and calculators</text><text x="42" y="308" font-family="sans-serif" font-size="17" font-weight="700" fill="#18536e" text-anchor="start" xml:space="preserve">U.S. energy facts</text><text x="42" y="346" font-family="sans-serif" font-size="17" font-weight="400" fill="#455b70" text-anchor="start" xml:space="preserve">Use of energy</text><text x="42" y="384" font-family="sans-serif" font-size="17" font-weight="400" fill="#455b70" text-anchor="start" xml:space="preserve">Energy and the</text><text x="42" y="409" font-family="sans-serif" font-size="17" font-weight="400" fill="#455b70" text-anchor="start" xml:space="preserve">environment</text><line x1="265" y1="160" x2="265" y2="760" stroke="#d3d9df" stroke-width="1"/><text x="300" y="175" font-family="sans-serif" font-size="32" font-weight="700" fill="#17232d" text-anchor="start" xml:space="preserve">U.S. energy facts explained</text><text x="300" y="225" font-family="sans-serif" font-size="24" font-weight="700" fill="#17232d" text-anchor="start" xml:space="preserve">Measuring consumption and production</text><text x="300" y="267" font-family="sans-serif" font-size="19" font-weight="400" fill="#17232d" text-anchor="start" xml:space="preserve">The transportation, industrial, residential, and commercial sectors are called end-use sectors.</text><text x="300" y="295" font-family="sans-serif" font-size="19" font-weight="400" fill="#17232d" text-anchor="start" xml:space="preserve">They consume primary energy and electricity produced by the electric power sector.</text><text x="300" y="350" font-family="sans-serif" font-size="21" font-weight="700" fill="#17232d" text-anchor="start" xml:space="preserve">Total energy consumption by the end-use sectors includes:</text><text x="312" y="400" font-family="sans-serif" font-size="23" font-weight="700" fill="#263943" text-anchor="start" xml:space="preserve">•</text><text x="340" y="400" font-family="sans-serif" font-size="21" font-weight="400" fill="#17232d" text-anchor="start" xml:space="preserve">Primary energy use</text><text x="312" y="450" font-family="sans-serif" font-size="23" font-weight="700" fill="#263943" text-anchor="start" xml:space="preserve">•</text><text x="340" y="450" font-family="sans-serif" font-size="21" font-weight="400" fill="#17232d" text-anchor="start" xml:space="preserve">Purchased electricity</text><text x="312" y="500" font-family="sans-serif" font-size="23" font-weight="700" fill="#263943" text-anchor="start" xml:space="preserve">•</text><text x="340" y="500" font-family="sans-serif" font-size="21" font-weight="400" fill="#17232d" text-anchor="start" xml:space="preserve">Electrical system energy losses (energy conversion and other losses associated with</text><text x="364" y="538" font-family="sans-serif" font-size="21" font-weight="400" fill="#17232d" text-anchor="start" xml:space="preserve">generating, transmitting, and distributing purchased electricity)</text><text x="312" y="588" font-family="sans-serif" font-size="23" font-weight="700" fill="#263943" text-anchor="start" xml:space="preserve">•</text><text x="340" y="588" font-family="sans-serif" font-size="21" font-weight="400" fill="#17232d" text-anchor="start" xml:space="preserve">Other energy losses</text><text x="300" y="670" font-family="sans-serif" font-size="23" font-weight="700" fill="#17232d" text-anchor="start" xml:space="preserve">Energy consumption by sector</text><text x="300" y="710" font-family="sans-serif" font-size="19" font-weight="400" fill="#17232d" text-anchor="start" xml:space="preserve">The energy sources each sector primarily uses vary widely.</text><text x="300" y="740" font-family="sans-serif" font-size="19" font-weight="400" fill="#17232d" text-anchor="start" xml:space="preserve">Petroleum is the primary fuel in the transportation sector’s energy consumption mix.</text><line x1="300" y1="790" x2="1215" y2="790" stroke="#c8d0d6" stroke-width="1"/><text x="300" y="824" font-family="sans-serif" font-size="16" font-weight="400" fill="#52687b" text-anchor="start" xml:space="preserve">Source: U.S. Energy Information Administration  •  Monthly Energy Review</text></svg>