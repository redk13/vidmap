name: stills
on:
  workflow_dispatch:
    inputs:
      comp:
        default: 'mapTest'
      frames:
        default: '0,40,80,119'
jobs:
  stills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: |
          for fr in $(echo "${{ inputs.frames }}" | tr ',' ' '); do
            npx remotion still src/index.ts "${{ inputs.comp }}" "out/f${fr}.png" --frame="$fr"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: stills-${{ inputs.comp }}
          path: out/
