name: SR71_Primal_Space_Masterpiece_1080p
on:
  workflow_dispatch:

jobs:
  render_shards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 6, 7, 8, 19]
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender 4.3.2 & Python Deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libgl1 libxi6 libxrender1 libxkbcommon0 libsm6
          pip install -q numpy opencv-python-headless pillow
          wget -q https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -O /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp/
      - name: Render Shard ${{ matrix.shard }}
        env:
          BLENDER_BIN: /tmp/blender-4.3.2-linux-x64/blender
        run: |
          python3 sr71_doc/render_sr71_shard.py ${{ matrix.shard }} /tmp/shard_${{ matrix.shard }}.mp4
      - name: Upload Shard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shard_${{ matrix.shard }}
          path: /tmp/shard_${{ matrix.shard }}.mp4
