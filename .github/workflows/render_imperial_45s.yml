name: Assemble Rasputin 1916 Imperial 50s 1080p Masterpiece (All 20 Shards Ready)
on:
  workflow_dispatch:
    inputs:
      gh_pat:
        description: "PAT for cross-run REST API artifact download"
        required: true
        type: string

jobs:
  assemble_masterpiece:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Compositor Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core unzip jq
          pip install -q pillow numpy

      - name: Download All 20 Shards via GitHub REST API (18 from 39070421386 + 2 from 39102320533)
        env:
          PAT: ${{ inputs.gh_pat }}
        run: |
          set -e
          mkdir -p /tmp/all_3d_frames
          for RID in 39070421386 39102320533; do
            echo "Listing artifacts for Run $RID..."
            curl -s -H "Authorization: Bearer $PAT" \
              "https://api.github.com/repos/redk13/vidmap/actions/runs/$RID/artifacts?per_page=100" \
              | jq -r '.artifacts[] | select(.name | startswith("rasputin-3d-shard-")) | "\(.name) \(.archive_download_url)"' \
              | while read -r NAME URL; do
                  echo "Downloading $NAME..."
                  curl -sL -H "Authorization: Bearer $PAT" "$URL" -o "/tmp/${NAME}.zip"
                  unzip -q -o "/tmp/${NAME}.zip" -d /tmp/all_3d_frames/
                  rm -f "/tmp/${NAME}.zip"
                done
          done
          COUNT=$(ls -1 /tmp/all_3d_frames/*.png | wc -l)
          echo "Total assembled 3D frames: $COUNT"
          test "$COUNT" -eq 1500

      - name: Run 1080p Compositor + Audio Mixer + H.264 Encode
        run: |
          set -e
          mkdir -p /tmp/final_out
          python3 imperial_45s/render_rasputin_compositor.py \
            /tmp/all_3d_frames \
            /tmp/final_out/Rasputin_1916_Imperial_Masterpiece_1080p.mp4 \
            /tmp/final_out/Rasputin_1916_QA_5Panel.jpg
          ls -lh /tmp/final_out/

      - name: Upload Final 1080p Masterpiece Video & QA Sheet
        uses: actions/upload-artifact@v4
        with:
          name: Rasputin-1916-Imperial-Masterpiece-1080p
          path: |
            /tmp/final_out/Rasputin_1916_Imperial_Masterpiece_1080p.mp4
            /tmp/final_out/Rasputin_1916_QA_5Panel.jpg
