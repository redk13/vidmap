name: Assemble Rasputin 1916 Imperial 50s 1080p Masterpiece (All 20 Shards Ready)
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  assemble_masterpiece:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Compositor Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q pillow numpy

      - name: Download 18 Shards from Run 39070421386
        uses: actions/download-artifact@v4
        with:
          run-id: 39070421386
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/all_3d_frames
          pattern: rasputin-3d-shard-*
          merge-multiple: true

      - name: Download 2 Shards (12 & 14) from Run 39102320533
        uses: actions/download-artifact@v4
        with:
          run-id: 39102320533
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/all_3d_frames
          pattern: rasputin-3d-shard-*
          merge-multiple: true

      - name: Verify All 1500 Frames & Run 1080p Compositor + Audio Mixer
        run: |
          set -e
          COUNT=$(ls -1 /tmp/all_3d_frames/*.png | wc -l)
          echo "Total assembled 3D frames: $COUNT"
          mkdir -p /tmp/final_out
          python3 imperial_45s/render_rasputin_compositor.py \
            /tmp/all_3d_frames \
            /tmp/final_out/Rasputin_1916_Imperial_Masterpiece_1080p.mp4 \
            /tmp/final_out/Rasputin_1916_QA_5Panel.jpg
          ls -lh /tmp/final_out/

      - name: Upload Final 1080p Masterpiece Video & QA Sheet
        uses: actions/upload-artifact@v4
        with:
          name: Rasputin-1916-Imperial-Masterpiece-1080p
          path: |
            /tmp/final_out/Rasputin_1916_Imperial_Masterpiece_1080p.mp4
            /tmp/final_out/Rasputin_1916_QA_5Panel.jpg
