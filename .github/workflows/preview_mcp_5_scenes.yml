name: Render 5-Scene Blender MCP + BlenderKit Reference Comparison
on:
  workflow_dispatch:

jobs:
  render_stills:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scene_id: [0, 1, 2, 3, 4]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Blender 4.3.2 & Deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0 libsm6 libice6 libgl1
          pip install -q opencv-python-headless pillow numpy
          curl -sL https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz | sudo tar -xJ -C /opt/
          sudo ln -sf /opt/blender-4.3.2-linux-x64/blender /usr/local/bin/blender

      - name: Render Scene Still
        run: |
          mkdir -p /tmp/stills
          blender -b -P imperial_45s/render_mcp_5_stills.py -- ${{ matrix.scene_id }} /tmp/stills/scene_${{ matrix.scene_id }}.png
          ls -lh /tmp/stills/

      - name: Upload Still
        uses: actions/upload-artifact@v4
        with:
          name: still-${{ matrix.scene_id }}
          path: /tmp/stills/scene_${{ matrix.scene_id }}.png

  stitch_board:
    needs: render_stills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All 5 Stills
        uses: actions/download-artifact@v4
        with:
          path: /tmp/stills
          merge-multiple: true

      - name: Build Side-by-Side Comparison Board
        run: |
          pip install -q opencv-python-headless pillow numpy
          python3 imperial_45s/render_mcp_5_stills.py --stitch /tmp/stills /tmp/MCP_5Scenes_SideBySide_Board.jpg
          ls -lh /tmp/MCP_5Scenes_SideBySide_Board.jpg

      - name: Upload Comparison Board
        uses: actions/upload-artifact@v4
        with:
          name: MCP-5Scenes-SideBySide-Board
          path: /tmp/MCP_5Scenes_SideBySide_Board.jpg
