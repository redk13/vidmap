name: Render Rome Technique 7 (Wan 2.2 AI Video + Blender 4.3.2 3D Tracked Overlays)

on:
  push:
    paths:
      - 'rome_tech7_wan_blender/**'
      - '.github/workflows/render_rome_tech7_wan_blender.yml'
  workflow_dispatch:

jobs:
  wan_and_blender_shot:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shot: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python deps (gradio_client, opencv) & Blender 4.3.2
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg
          pip install -q gradio_client huggingface_hub opencv-python-headless numpy
          curl --retry 5 --retry-all-errors -sL https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
          /tmp/blender-4.3.2-linux-x64/4.3/python/bin/python3.11 -m pip install -q pillow

      - name: Generate AI Video via Wan 2.2 / LTX-Video
        run: |
          python3 rome_tech7_wan_blender/generate_wan_clip.py ${{ matrix.shot }} /tmp/wan_shot_${{ matrix.shot }}.mp4

      - name: Track 3D Spline & Callouts via Lucas-Kanade Optical Flow
        run: |
          mkdir -p /tmp/wan_frames /tmp/out_frames
          python3 rome_tech7_wan_blender/track_optical_flow.py ${{ matrix.shot }} /tmp/wan_shot_${{ matrix.shot }}.mp4 /tmp/wan_frames /tmp/tracked_uvs.json

      - name: Render 3D Tracked Overlays & Relighting in Blender 4.3.2
        run: |
          /tmp/blender-4.3.2-linux-x64/blender -b -P rome_tech7_wan_blender/render_wan_blender.py -- ${{ matrix.shot }} /tmp/wan_frames /tmp/tracked_uvs.json /tmp/out_frames

      - name: Upload Shot Rendered Frames & Raw Wan Clip
        uses: actions/upload-artifact@v4
        with:
          name: tech7-shot-${{ matrix.shot }}
          path: |
            /tmp/out_frames/frame_*.jpg
            /tmp/wan_shot_${{ matrix.shot }}.mp4
          retention-days: 3

  assemble_tech7_video:
    needs: wan_and_blender_shot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all 5 shots
        uses: actions/download-artifact@v4
        with:
          pattern: tech7-shot-*
          path: /tmp/all_shots
          merge-multiple: true

      - name: Encode 7.mp4 with FFmpeg
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg
          find /tmp/all_shots -name "frame_*.jpg" -exec mv {} /tmp/all_shots/ \; || true
          ffmpeg -y -framerate 30 -start_number 1 -i /tmp/all_shots/frame_%04d.jpg -i rome_ai_3d/assets/rome_20s_master_audio.m4a -c:v libx264 -preset fast -crf 20 -pix_fmt yuv420p -c:a copy -shortest /tmp/7.mp4

      - name: Upload final 7.mp4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-video-7-wan-blender
          path: /tmp/7.mp4
          retention-days: 5
